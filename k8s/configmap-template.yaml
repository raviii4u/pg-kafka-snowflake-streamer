apiVersion: v1
kind: ConfigMap
metadata:
  name: ${CONFIG_MAP_NAME}
  namespace: ${NAMESPACE}
data:
  CLOUD_ENV: "${ENVIRONMENT}"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SNOWFLAKE_DATABASE: "${SNOWFLAKE_DATABASE}"
  SNOWFLAKE_ROLE: "${SNOWFLAKE_ROLE}"
  SNOWFLAKE_SCHEMA: "${SNOWFLAKE_SCHEMA}"
  SNOWFLAKE_URL: "${SNOWFLAKE_URL}"
  SNOWFLAKE_USERNAME: "${SNOWFLAKE_USERNAME}"
  SNOWFLAKE_WAREHOUSE: "${SNOWFLAKE_WAREHOUSE}"
  debezium.properties.converters: "datetime"
  debezium.properties.database.dbname: "${POSTGRES_DATABASE}"
  debezium.properties.database.hostname: "${POSTGRES_HOST}"
  debezium.properties.database.port: "${POSTGRES_PORT}"
  debezium.properties.database.user: "${POSTGRES_USER}"
  debezium.properties.datetime.type: "io.cdcstreamers.converter.CustomDateTimeConverter"
  debezium.properties.decimal.handling.mode: "string"
  debezium.properties.name: "postgres-connector"
  debezium.properties.offset.storage.file.filename: "/var/lib/cdc-offsets/pg-kafka-snowflake-streamer-${AGENT_NAME}-offsets.dat"
  debezium.properties.publication.name: "${PUBLICATION_NAME}"
  debezium.properties.schema.include.list: "${SCHEMA_INCLUDE_LIST}"
  debezium.properties.slot.name: "${REPLICATION_SLOT_NAME}"
  debezium.properties.snapshot.mode: "never"
  debezium.properties.table.exclude.list: "${TABLE_EXCLUDE_LIST:-}"
  debezium.properties.time.precision.mode: "connect"
  debezium.properties.topic.prefix: "cdc"
  debezium.properties.heartbeat.interval.ms: "10000"
  debezium.properties.heartbeat.topics.prefix: "heartbeat"
  KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
  KAFKA_CONSUMER_CLIENT_ID: "${KAFKA_CONSUMER_CLIENT_ID}"
  KAFKA_CONSUMER_GROUP_ID: "${KAFKA_CONSUMER_GROUP_ID}"
  KAFKA_CONSUMER_TOPIC_PATTERN: "${KAFKA_CONSUMER_TOPIC_PATTERN}"
  KAFKA_TOPIC_PREFIX: "${KAFKA_TOPIC_PREFIX}"
  CDC_BATCH_SIZE: "${CDC_BATCH_SIZE:-500}"
  CDC_MODE: "${CDC_MODE:-REALTIME}"
  CDC_BATCH_TIMEOUT: "${CDC_BATCH_TIMEOUT:-300000}"
  CDC_PRODUCER_ENABLED: "${CDC_PRODUCER_ENABLED:-true}"
  CDC_CONSUMER_ENABLED: "${CDC_CONSUMER_ENABLED:-true}"
  PG_SNAPSHOT_ENABLED: "${PG_SNAPSHOT_ENABLED:-false}"
  PG_SNAPSHOT_TARGET_DATABASE: "${PG_SNAPSHOT_TARGET_DATABASE:-}"
  PG_SNAPSHOT_TARGET_SCHEMAS: "${PG_SNAPSHOT_TARGET_SCHEMAS:-}"
  PG_SNAPSHOT_BATCH_SIZE: "${PG_SNAPSHOT_BATCH_SIZE:-1500000}"
  PG_SNAPSHOT_THREADS: "${PG_SNAPSHOT_THREADS:-4}"
  PG_SNAPSHOT_TEMP_DIR: "${PG_SNAPSHOT_TEMP_DIR:-/tmp/pg-snapshot}"
  PG_SNAPSHOT_DATETIME: "${PG_SNAPSHOT_DATETIME:-}"