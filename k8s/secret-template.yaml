apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  SNOWFLAKE_PASSWORD: "${SNOWFLAKE_PASSWORD}"
  SPRING_BOOT_JAVA_OPTS: "--add-opens=java.base/java.nio=ALL-UNNAMED"
  debezium.properties.database.password: "${POSTGRES_PASSWORD}"